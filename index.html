
<!-- Only for redirecting to https://vansh-py.github.io/MyResume/resume.html -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0a0f">

    <title>Redirecting | Vansh's Resume</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Segoe UI", sans-serif;
            background: #0a0a0f;
            color: #f5f5f5;
            overflow: hidden;
        }

        .loader-container {
            width: min(90%, 380px);
            text-align: center;
            padding: 40px 28px;
            background: rgba(255, 255, 255, 0.035);
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 24px;
            box-shadow: 0 20px 80px rgba(0, 0, 0, 0.3);
            animation: appear 0.8s ease;
        }

        .logo {
            width: 68px;
            height: 68px;
            display: grid;
            place-items: center;
            margin: 0 auto 26px;
            border-radius: 20px;
            background: linear-gradient(135deg, #8b5cf6, #4f46e5);
            font-size: 25px;
            font-weight: 700;
            box-shadow: 0 0 35px rgba(139, 92, 246, 0.25);
        }

        h1 {
            font-size: 25px;
            font-weight: 600;
            letter-spacing: -0.8px;
            margin-bottom: 10px;
        }

        p {
            color: #9999ad;
            font-size: 14px;
            line-height: 1.7;
        }

        .spinner {
            width: 42px;
            height: 42px;
            margin: 30px auto 20px;
            border: 3px solid #292938;
            border-top-color: #a78bfa;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .progress-track {
            width: 100%;
            height: 4px;
            margin: 24px 0 12px;
            background: #252531;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #6366f1, #c084fc);
            border-radius: inherit;
            animation: load 2s ease-in-out forwards;
        }

        .status {
            font-size: 12px;
            color: #77778c;
            letter-spacing: 0.4px;
        }

        .fallback {
            display: inline-block;
            margin-top: 22px;
            color: #c4b5fd;
            font-size: 13px;
            text-decoration: none;
        }

        .fallback:hover {
            color: #ffffff;
        }

        .glow {
            position: fixed;
            width: 350px;
            height: 350px;
            background: #4f46e5;
            filter: blur(150px);
            opacity: 0.12;
            z-index: -1;
            pointer-events: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes load {
            to {
                width: 100%;
            }
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>

<body>

    <div class="glow"></div>

    <main class="loader-container">

        <div class="logo">V</div>

        <h1>Almost there.</h1>

        <p>
            Opening my resume.<br>
            Please wait a moment.
        </p>

        <div class="spinner"></div>

        <div class="status" id="status">
            Preparing your resume...
        </div>

        <div class="progress-track">
            <div class="progress"></div>
        </div>

        <p class="status">
            VANSH CHANDEL · RESUME
        </p>

        <a
            class="fallback"
            href="https://vansh-py.github.io/MyResume/resume.html"
        >
            Not redirected? Click here →
        </a>

    </main>

    <script>
        const destination =
            "https://vansh-py.github.io/MyResume/resume.html";

        const status = document.getElementById("status");

        setTimeout(() => {
            status.textContent = "Opening your resume...";
        }, 1000);

        setTimeout(() => {
            window.location.replace(destination);
        }, 2000);
    </script>

</body>
</html>
